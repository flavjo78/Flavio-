<!doctype html>
<html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>abraka — vetrina video</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
  :root{--fg:#f4ecda;--dim:#d8c9b2;--gold:#e7c983;--goldink:#f0d79a;--display:"Playfair Display",Georgia,serif;--body:"Source Sans 3",system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
  body{font-family:var(--body);color:var(--fg);overflow:hidden;background:#000}
  .bg{position:fixed;inset:0;z-index:0}.bg img{width:100%;height:100%;object-fit:cover}
  .shade{position:fixed;inset:0;z-index:1;background:linear-gradient(to bottom,rgba(0,0,0,.42),rgba(0,0,0,.08) 44%,rgba(0,0,0,.6))}
  .page{position:relative;z-index:3;height:100%;display:flex;flex-direction:column}
  header{display:flex;align-items:center;justify-content:space-between;padding:18px clamp(18px,5vw,54px)}
  .brand{font-family:var(--display);font-weight:700;font-size:clamp(28px,3.6vw,44px);color:var(--goldink);text-shadow:0 2px 14px rgba(0,0,0,.6)}
  .enter{font:inherit;font-weight:700;color:#241a08;background:var(--gold);border-radius:999px;padding:11px clamp(22px,2.6vw,34px);text-decoration:none}
  .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 20px clamp(20px,6vh,70px)}
  .medal{width:clamp(150px,22vw,280px);aspect-ratio:1;border-radius:50%;cursor:pointer;background:radial-gradient(circle at 50% 36%,rgba(40,29,19,.9),rgba(8,6,3,.95));
    border:4px solid var(--goldink);box-shadow:0 18px 44px rgba(0,0,0,.6),0 0 0 9px rgba(231,201,131,.12),0 0 60px rgba(231,201,131,.3);display:flex;align-items:center;justify-content:center}
  .medal .g{font-family:var(--display);font-weight:700;font-size:clamp(70px,11vw,140px);color:var(--goldink)}
  .appname{font-family:var(--display);font-weight:700;font-size:clamp(30px,4.6vw,52px);margin-top:clamp(20px,3vh,36px);text-shadow:0 2px 16px rgba(0,0,0,.7)}
  .hint{color:var(--dim);margin-top:10px}
  .vwrap{position:fixed;inset:0;z-index:6;background:#000;opacity:0;pointer-events:none;transition:opacity .4s}
  .vwrap.on{opacity:1;pointer-events:auto}.vwrap video{width:100%;height:100%;object-fit:cover}
  .vshade{position:absolute;inset:0;z-index:7;background:radial-gradient(ellipse at center,rgba(0,0,0,.15),rgba(0,0,0,.55));opacity:0;transition:opacity .8s;pointer-events:none}
  .vwrap.ended .vshade{opacity:1}
  .after{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 20px;opacity:0;pointer-events:none;transform:translateY(46vh);transition:transform 1.05s cubic-bezier(.18,.7,.2,1),opacity .7s}
  .vwrap.ended .after{opacity:1;pointer-events:auto;transform:translateY(0)}
  .after .back{margin-top:22px;font:inherit;font-weight:700;color:var(--goldink);background:rgba(16,11,10,.55);border:1.5px solid var(--goldink);border-radius:999px;padding:11px 24px;cursor:pointer}
  .skip{position:absolute;bottom:20px;right:20px;z-index:9;font:inherit;font-weight:700;color:#fff;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:8px 16px;cursor:pointer}
</style></head>
<body>
  <div class="bg"><img src="palco.jpg" alt="palco"></div><div class="shade"></div>
  <div class="page">
    <header><div class="brand">abraka</div><a class="enter" href="#">Accedi</a></header>
    <div class="center"><div class="medal" id="medalStart"><span class="g">P</span></div><div class="appname">Predizione</div><div class="hint">Tocca la «P» per entrare in teatro</div></div>
  </div>
  <div class="vwrap" id="vwrap">
    <video id="vid" playsinline preload="auto" src="video2.mp4"></video><div class="vshade"></div>
    <button class="skip" id="skip">Salta »</button>
    <div class="after"><div class="medal"><span class="g">P</span></div><div class="appname">Predizione</div><button class="back" id="back">↩ ritorna al palco</button></div>
  </div>
<script>
  var vwrap=document.getElementById('vwrap'),vid=document.getElementById('vid');
  function fine(){vwrap.classList.add('ended');}
  document.getElementById('medalStart').onclick=function(){vwrap.classList.add('on');vwrap.classList.remove('ended');try{vid.currentTime=0;}catch(e){}vid.play().catch(function(){});};
  vid.addEventListener('ended',fine);
  document.getElementById('skip').onclick=function(){vid.pause();fine();};
  document.getElementById('back').onclick=function(){vwrap.classList.remove('on');vwrap.classList.remove('ended');try{vid.pause();vid.currentTime=0;}catch(e){}};
</script>
</body></html>
