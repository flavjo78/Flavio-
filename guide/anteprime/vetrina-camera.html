<!doctype html>
<html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anteprima — abraka (effetto camera)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
  :root{--fg:#f4ecda;--dim:#d8c9b2;--gold:#e7c983;--gold-ink:#f0d79a;
    --display:"Playfair Display",Georgia,serif;--body:"Source Sans 3",system-ui,-apple-system,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--body);color:var(--fg);overflow:hidden;background:#000}
  .layer{position:fixed;inset:0;z-index:0}
  .layer img{width:100%;height:100%;object-fit:cover;display:block}
  #palco img{transition:transform 1.6s cubic-bezier(.5,.05,.25,1)}
  #sala{opacity:0;z-index:0;transition:opacity 1s ease .4s}
  #sala img{transform:scale(1.22);transition:transform 2.4s ease}
  .shade{position:fixed;inset:0;z-index:1;background:linear-gradient(to bottom,rgba(0,0,0,.42),rgba(0,0,0,.08) 44%,rgba(0,0,0,.6));transition:opacity .6s}
  .page{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;transition:opacity .55s}
  .demo{background:rgba(58,42,14,.8);color:#f0d79a;text-align:center;font-size:12px;font-weight:700;padding:6px 10px;letter-spacing:.04em}
  header.top{display:flex;align-items:center;justify-content:space-between;padding:18px clamp(18px,5vw,54px)}
  .brand{font-family:var(--display);font-weight:700;font-size:clamp(28px,3.6vw,44px);color:var(--gold-ink);text-shadow:0 2px 14px rgba(0,0,0,.6)}
  .enter{font:inherit;font-weight:700;font-size:clamp(14px,1.4vw,18px);text-decoration:none;color:#241a08;background:var(--gold);border-radius:999px;padding:11px clamp(22px,2.6vw,34px);box-shadow:0 6px 20px rgba(0,0,0,.4)}
  .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 clamp(14px,4vw,40px) clamp(20px,6vh,70px);text-align:center}
  .stageRow{display:flex;align-items:center;justify-content:center;gap:clamp(20px,5vw,80px)}
  .medal{position:relative;width:clamp(150px,22vw,280px);aspect-ratio:1;border-radius:50%;cursor:pointer;
    background:radial-gradient(circle at 50% 36%,rgba(40,29,19,.9),rgba(8,6,3,.95));
    border:4px solid var(--gold-ink);box-shadow:0 18px 44px rgba(0,0,0,.6),0 0 0 9px rgba(231,201,131,.12),0 0 60px rgba(231,201,131,.3);
    display:flex;align-items:center;justify-content:center;transition:transform .4s}
  .medal:hover{transform:scale(1.04)}
  .medal .g{font-family:var(--display);font-weight:700;font-size:clamp(70px,11vw,140px);color:var(--gold-ink)}
  .arrow{width:clamp(52px,5.5vw,76px);aspect-ratio:1;border-radius:50%;cursor:pointer;background:rgba(16,11,10,.55);
    border:2px solid var(--gold-ink);color:var(--gold-ink);display:flex;align-items:center;justify-content:center;
    font-size:clamp(28px,3.4vw,40px);backdrop-filter:blur(3px)}
  .appname{font-family:var(--display);font-weight:700;font-size:clamp(30px,4.6vw,52px);margin-top:clamp(20px,3vh,36px);text-shadow:0 2px 16px rgba(0,0,0,.7)}
  .hint{color:var(--dim);font-size:clamp(14px,1.6vw,18px);margin-top:10px;text-shadow:0 1px 10px rgba(0,0,0,.7)}
  /* === immersione === */
  body.diving #palco img{transform:scale(2.8) translateY(-7%)}
  body.diving .shade{opacity:.2}
  body.diving .page{opacity:0;pointer-events:none}
  body.diving #sala{opacity:1}
  body.diving #sala img{transform:scale(1)}
  .arrived{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    text-align:center;opacity:0;pointer-events:none;transition:opacity .7s 1.1s;padding:0 20px clamp(26px,7vh,70px)}
  body.diving .arrived{opacity:1;pointer-events:auto}
  .arrived h2{font-family:var(--display);font-weight:700;font-size:clamp(28px,4.4vw,48px);text-shadow:0 2px 18px rgba(0,0,0,.9)}
  .arrived .go{margin-top:16px;font:inherit;font-weight:700;font-size:17px;color:#241a08;background:var(--gold);border:none;border-radius:999px;padding:13px 30px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.5)}
  .arrived .back{margin-top:12px;background:none;border:none;color:var(--dim);font:inherit;cursor:pointer;text-decoration:underline}
</style></head>
