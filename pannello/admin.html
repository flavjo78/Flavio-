<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Predizione — Amministrazione</title>
<style>
  :root{
    --bg:#0a0908; --bg-deep:#060505; --surface:#1b1712; --surface-2:#2a251d;
    --line:rgba(236,224,201,.09); --line-2:rgba(236,224,201,.16);
    --ink:#ece0c9; --ink-dim:#9a8f7b; --faint:#6c6455;
    --gold:#c9a465; --gold-soft:rgba(201,164,101,.14);
    --good:#86b26f; --good-soft:rgba(134,178,111,.14);
    --stop:#cf8262; --stop-soft:rgba(207,130,98,.14); --r:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg-deep);color:var(--ink);font-family:"Manrope",system-ui,-apple-system,sans-serif;line-height:1.5}
  .wrap{max-width:720px;margin:0 auto;padding:22px 16px 60px}
  .kicker{color:var(--gold);letter-spacing:.4em;text-transform:uppercase;font-size:10px;font-weight:600;text-align:center}
  h1{font-family:Georgia,serif;font-weight:400;font-size:30px;text-align:center;margin:2px 0 2px}
  .sub{text-align:center;color:var(--ink-dim);font-size:12px;margin-bottom:18px}
  .card{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:16px;margin-bottom:14px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .num{font-family:Georgia,serif;font-size:22px;color:var(--gold);min-width:52px}
  .pill{font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-dim);border:1px solid var(--line-2)}
  .pill.on{background:var(--good-soft);color:var(--good);border-color:transparent}
  .pill.off{background:var(--stop-soft);color:var(--stop);border-color:transparent}
  .meta{color:var(--faint);font-size:12px;margin-top:6px}
  label.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-dim);cursor:pointer}
  input,button,select{font-family:inherit}
  input[type=text],input[type=email],input[type=password]{background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px;width:100%}
  .field{margin-top:8px}
  .field label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:4px}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .btn{cursor:pointer;font-size:13px;font-weight:700;padding:9px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink)}
  .btn.gold{background:linear-gradient(180deg,#d8b877,#c39a52);color:#231a0c;border-color:transparent}
  .btn.danger{color:var(--stop);border-color:var(--stop-soft)}
  .btn:active{transform:scale(.98)}
  .sep{height:1px;background:var(--line);margin:12px 0}
  .small{font-size:12px;color:var(--faint)}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink);padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.show{opacity:1}
  .toast.err{background:var(--stop-soft);color:var(--stop);border-color:transparent}
  .toast.ok{background:var(--good-soft);color:var(--good);border-color:transparent}
  .hidden{display:none}
  .login-card{max-width:340px;margin:40px auto}
  a.back{display:inline-block;color:var(--ink-dim);font-size:12px;text-decoration:none;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <p class="kicker">Predizione</p>
  <h1>Amministrazione</h1>
  <p class="sub">Gestione utenti · accesso 000</p>

  <!-- LOGIN ADMIN -->
  <div class="card login-card" id="adminLogin">
    <div class="field"><label for="aUser">Utente (admin)</label><input type="text" id="aUser" value="000" inputmode="numeric"></div>
    <div class="field"><label for="aPass">Password</label><input type="password" id="aPass" placeholder="password admin"></div>
    <div class="btns"><button class="btn gold" id="aEnter" style="width:100%">Entra</button></div>
    <a class="back" href="regia-predizione.html">← torna al pannello</a>
  </div>

  <!-- CONTENUTO ADMIN -->
  <div id="adminBody" class="hidden">
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <b>Nuovo utente</b>
        <a class="back" href="regia-predizione.html">← pannello</a>
      </div>
      <div class="field"><label for="nNum">Numero (es. 004)</label><input type="text" id="nNum" inputmode="numeric" placeholder="004"></div>
      <div class="field"><label for="nPw">Password</label><input type="text" id="nPw" placeholder="aaa"></div>
      <div class="row" style="margin-top:10px">
        <label class="chk"><input type="checkbox" id="nMail"> funzione mail</label>
        <label class="chk"><input type="checkbox" id="nFoto"> strumento foto</label>
      </div>
      <div class="btns"><button class="btn gold" id="nCrea">Crea utente</button></div>
    </div>

    <div id="lista"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  var API='./';
  var $=function(id){return document.getElementById(id);};
  var AU='000', AP='';
  try{ if((localStorage.getItem('pred_user')||'')==='000') AP=localStorage.getItem('pred_pw')||''; }catch(e){}

  var toastEl=$('toast'), tT=null;
  function toast(m,k){ toastEl.textContent=m; toastEl.className='toast show'+(k?(' '+k):''); clearTimeout(tT); tT=setTimeout(function(){toastEl.className='toast';},2600); }

  function call(azione, params){
    var b=new URLSearchParams(); b.set('azione',azione); b.set('utente',AU); b.set('password',AP);
    if(params){ for(var k in params){ b.set(k, params[k]); } }
    return fetch(API+'stato.php',{method:'POST',body:b}).then(function(r){return r.json().then(function(j){return {code:r.status,data:j};});});
  }

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function faseLbl(f){ return {spento:'Spento',avviato:'In corso',cambiato:'Rivelato',terminato:'Terminato'}[f]||f; }

  function render(utenti){
    var box=$('lista'); box.innerHTML='';
    utenti.forEach(function(u){
      if(u.admin) return; // l'admin non si gestisce come utente
      var c=document.createElement('div'); c.className='card';
      c.innerHTML=
        '<div class="row" style="justify-content:space-between">'+
          '<span class="num">'+esc(u.numero)+'</span>'+
          '<span class="pill '+(u.attivo?'on':'off')+'">'+(u.attivo?'attivo':'sospeso')+'</span>'+
        '</div>'+
        '<div class="meta">Stato: <b>'+faseLbl(u.fase)+'</b> · sessione '+(u.sessione||'—')+' · aperture '+(u.aperture||0)+
          ' · password: <b>'+esc(u.pass)+'</b> · mail: '+(u.mail_impostata?'✔ impostata':'—')+'</div>'+
        '<div class="row" style="margin-top:10px">'+
          '<label class="chk"><input type="checkbox" class="fMail" '+(u.flags.mail?'checked':'')+'> mail</label>'+
          '<label class="chk"><input type="checkbox" class="fFoto" '+(u.flags.foto?'checked':'')+'> foto</label>'+
          '<button class="btn" data-a="flags">Salva funzioni</button>'+
        '</div>'+
        '<div class="sep"></div>'+
        '<div class="field"><label>Cambia password</label><input type="text" class="inPw" placeholder="nuova password"></div>'+
        '<div class="btns">'+
          '<button class="btn" data-a="pw">Salva password</button>'+
          '<button class="btn" data-a="attiva">'+(u.attivo?'Sospendi':'Riattiva')+'</button>'+
          '<button class="btn danger" data-a="del">Elimina</button>'+
        '</div>'+
        '<div class="sep"></div>'+
        '<div class="field"><label>Casella (Gmail dell\'utente) — facoltativa</label><input type="email" class="inEmail" placeholder="utente@gmail.com"></div>'+
        '<div class="field"><input type="text" class="inApp" placeholder="password per app (16 lettere)"></div>'+
        '<div class="field"><input type="text" class="inFrom" placeholder="nome mittente (facoltativo)"></div>'+
        '<div class="btns"><button class="btn" data-a="mail">Salva casella</button></div>';

      c.querySelectorAll('button[data-a]').forEach(function(btn){
        btn.addEventListener('click', function(){
          var a=btn.getAttribute('data-a'), num=u.numero;
          if(a==='flags'){
            call('admin_flags',{numero:num, mail:c.querySelector('.fMail').checked?'1':'0', foto:c.querySelector('.fFoto').checked?'1':'0'}).then(function(r){ done(r,'Funzioni salvate'); });
          } else if(a==='pw'){
            var v=c.querySelector('.inPw').value.trim(); if(!v){toast('Scrivi la nuova password','err');return;}
            call('admin_password',{numero:num, pw:v}).then(function(r){ done(r,'Password aggiornata'); });
          } else if(a==='attiva'){
            call('admin_attiva',{numero:num, valore:(u.attivo?'0':'1')}).then(function(r){ done(r,'Stato aggiornato'); });
          } else if(a==='del'){
            if(!confirm('Eliminare l\'utente '+num+'? I suoi dati restano sul server ma l\'accesso viene rimosso.')) return;
            call('admin_elimina',{numero:num}).then(function(r){ done(r,'Utente eliminato'); });
          } else if(a==='mail'){
            var e=c.querySelector('.inEmail').value.trim(), ap=c.querySelector('.inApp').value.trim(), fr=c.querySelector('.inFrom').value.trim();
            if(!e||!ap){toast('Email e password per app','err');return;}
            call('admin_mail',{numero:num, email:e, app_password:ap, from:fr}).then(function(r){ done(r,'Casella salvata'); });
          }
        });
      });
      box.appendChild(c);
    });
  }

  function done(r, ok){
    if(r.data && r.data.ok){ toast(ok,'ok'); carica(); }
    else { toast((r.data&&r.data.errore)||'Errore','err'); }
  }

  function carica(){
    call('admin_utenti').then(function(r){
      if(r.code===403 || !(r.data&&r.data.ok)){ mostraLogin(); return; }
      $('adminLogin').classList.add('hidden'); $('adminBody').classList.remove('hidden');
      render(r.data.utenti||[]);
    }).catch(function(){ toast('Server non raggiungibile','err'); });
  }

  function mostraLogin(){ $('adminBody').classList.add('hidden'); $('adminLogin').classList.remove('hidden'); }

  $('aEnter').addEventListener('click', function(){
    AU=($('aUser').value||'000').replace(/[^0-9]/g,'')||'000';
    AP=($('aPass').value||'').trim();
    if(!AP){toast('Inserisci la password','err');return;}
    try{ localStorage.setItem('pred_user',AU); localStorage.setItem('pred_pw',AP); }catch(e){}
    carica();
  });
  $('aPass').addEventListener('keydown',function(e){ if(e.key==='Enter') $('aEnter').click(); });

  $('nCrea').addEventListener('click', function(){
    var num=($('nNum').value||'').replace(/[^0-9]/g,'');
    if(!num){toast('Scrivi il numero','err');return;}
    call('admin_crea',{numero:num, pw:($('nPw').value||'').trim(), mail:$('nMail').checked?'1':'0', foto:$('nFoto').checked?'1':'0'})
      .then(function(r){ if(r.data&&r.data.ok){ toast('Utente creato','ok'); $('nNum').value='';$('nPw').value='';$('nMail').checked=false;$('nFoto').checked=false; carica(); } else { toast((r.data&&r.data.errore)||'Errore','err'); } });
  });

  // avvio: se ho gia' le credenziali admin salvate, entro; altrimenti mostro il login
  if(AP){ carica(); } else { mostraLogin(); }
})();
</script>
</body>
</html>
