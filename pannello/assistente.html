<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Predizione — Assistente di scena</title>
<style>
  :root{
    --bg:#0a0908; --bg-deep:#060505; --surface:#1b1712; --surface-2:#2a251d;
    --line:rgba(236,224,201,.09); --line-2:rgba(236,224,201,.16);
    --ink:#ece0c9; --ink-dim:#9a8f7b; --faint:#6c6455;
    --gold:#c9a465; --gold-soft:rgba(201,164,101,.14);
    --good:#86b26f; --good-soft:rgba(134,178,111,.14);
    --stop:#cf8262; --stop-soft:rgba(207,130,98,.14); --r:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg-deep);color:var(--ink);font-family:"Manrope",system-ui,-apple-system,sans-serif;line-height:1.5}
  .wrap{max-width:460px;margin:0 auto;padding:22px 16px 60px}
  .kicker{color:var(--gold);letter-spacing:.4em;text-transform:uppercase;font-size:10px;font-weight:600;text-align:center}
  h1{font-family:Georgia,serif;font-weight:400;font-size:28px;text-align:center;margin:2px 0 2px}
  .sub{text-align:center;color:var(--ink-dim);font-size:12px;margin-bottom:18px}
  .card{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:16px;margin-bottom:14px}
  .phase{text-align:center}
  .phase .big{font-family:Georgia,serif;font-size:24px;color:var(--gold)}
  .phase .meta{color:var(--faint);font-size:12px;margin-top:4px}
  .cnt{display:flex;justify-content:center;gap:18px;margin-top:10px}
  .cnt div{text-align:center}
  .cnt b{display:block;font-size:22px;color:var(--ink)}
  .cnt span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  .sec-title{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:10px}
  input,button,textarea{font-family:inherit}
  textarea{background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:15px;width:100%;resize:vertical}
  .btn{cursor:pointer;font-size:15px;font-weight:700;padding:13px 12px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);width:100%}
  .btn.gold{background:linear-gradient(180deg,#d8b877,#c39a52);color:#231a0c;border-color:transparent}
  .btn.ghost{background:transparent}
  .btn:disabled{opacity:.4;cursor:default}
  .btn:active:not(:disabled){transform:scale(.99)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .slot{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:12px;padding:12px;cursor:pointer;margin-bottom:10px}
  .slot .t{font-weight:700;font-size:14px}
  .slot .s{display:block;font-size:12px;color:var(--faint)}
  .slot .tag{margin-left:auto;color:var(--gold);font-weight:700;font-size:12px}
  .mt{margin-top:8px}
  .hint{font-size:12px;color:var(--faint);margin-top:8px}
  .prev{width:100%;border-radius:12px;margin-top:10px;border:1px solid var(--line-2);display:none}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink);padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
  .toast.show{opacity:1}
  .toast.err{background:var(--stop-soft);color:var(--stop);border-color:transparent}
  .toast.ok{background:var(--good-soft);color:var(--good);border-color:transparent}
  .hidden{display:none}
  .errbox{text-align:center;color:var(--stop);padding:30px 10px}
</style>
</head>
<body>
<div class="wrap">
  <p class="kicker">Predizione</p>
  <h1>Assistente di scena</h1>
  <p class="sub" id="sub">Aiuti il prestigiatore · nessuna impostazione</p>

  <div id="main" class="hidden">
    <!-- stato del gioco -->
    <div class="card phase">
      <div class="big" id="phaseBig">—</div>
      <div class="meta" id="phaseMeta"></div>
      <div class="cnt">
        <div><b id="cntA">0</b><span>Foto A</span></div>
        <div><b id="cntB">0</b><span>Rivelate</span></div>
      </div>
    </div>

    <!-- comandi del gioco -->
    <div class="card">
      <div class="sec-title">Comandi del gioco</div>
      <button class="btn gold mt" id="bAvvia">▶ Avvia</button>
      <button class="btn mt" id="bCambia">✦ Cambia (rivela)</button>
      <button class="btn ghost mt" id="bFinisci">■ Finisci</button>
    </div>

    <!-- preparazione rivelazione (solo utenti foto) -->
    <div class="card hidden" id="secPrep">
      <div class="sec-title">Prepara la rivelazione</div>
      <label class="slot" id="slotBase">
        <input type="file" accept="image/*" hidden>
        <span><span class="t">Foto base</span><span class="s">il performer col foglio bianco</span></span>
        <span class="tag">Carica</span>
      </label>
      <img class="prev" id="basePrev" alt="foto base">
      <label class="sec-title mt" for="txt">Cosa scrivere sul foglio</label>
      <textarea id="txt" rows="2" placeholder="Es. Asso di cuori"></textarea>
      <button class="btn ghost mt" id="bNL">↵ Vai a capo</button>
      <button class="btn gold mt" id="bGen">Genera la rivelazione con IA</button>
      <img class="prev" id="genPrev" alt="rivelazione">
      <div class="hint">L'IA scrive la frase a mano sul foglio (~30s) e la prepara come rivelazione. Controlla sempre la foto prima di usarla.</div>
    </div>

    <!-- carica rivelazione pronta (per chi non usa l'IA) -->
    <div class="card hidden" id="secCarica">
      <div class="sec-title">Carica la rivelazione (Foto B)</div>
      <label class="slot" id="slotB">
        <input type="file" accept="image/*" hidden>
        <span><span class="t">Rivelazione</span><span class="s">la foto da svelare</span></span>
        <span class="tag">Carica</span>
      </label>
      <img class="prev" id="bPrev" alt="rivelazione">
    </div>
  </div>

  <div id="err" class="errbox hidden"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  var API='./';
  var $=function(id){return document.getElementById(id);};
  var qs=new URLSearchParams(location.search);
  var U=(qs.get('u')||'').replace(/[^0-9]/g,'');
  var T=(qs.get('t')||qs.get('assistente')||'').trim();

  var toastEl=$('toast'), tT=null;
  function toast(m,k){ toastEl.textContent=m; toastEl.className='toast show'+(k?(' '+k):''); clearTimeout(tT); tT=setTimeout(function(){toastEl.className='toast';},2600); }

  if(!U || !T){ mostraErr('Link non valido. Chiedi al prestigiatore di rigenerare il link.'); return; }

  function mostraErr(msg){ $('main').classList.add('hidden'); var e=$('err'); e.textContent=msg; e.classList.remove('hidden'); }

  function statoGet(){
    return fetch(API+'stato.php?azione=stato&u='+encodeURIComponent(U),{cache:'no-store'}).then(function(r){return r.json();});
  }
  function cmd(azione){
    var b=new URLSearchParams(); b.set('azione',azione); b.set('utente',U); b.set('assistente',T);
    return fetch(API+'stato.php',{method:'POST',body:b}).then(function(r){return r.json().then(function(j){return {code:r.status,data:j};});});
  }
  function generaIA(testo){
    var b=new URLSearchParams(); b.set('utente',U); b.set('assistente',T); b.set('testo',testo);
    return fetch(API+'genera_ia.php',{method:'POST',body:b}).then(function(r){return r.json().then(function(j){return {code:r.status,data:j};});});
  }
  function carica(slot,file){
    var fd=new FormData(); fd.set('utente',U); fd.set('assistente',T); fd.set('slot',slot); fd.set('foto',file);
    return fetch(API+'carica.php',{method:'POST',body:fd}).then(function(r){return r.json().then(function(j){return {code:r.status,data:j};});});
  }

  var cur={fase:'spento', flags:{}};
  function faseLbl(f){ return {spento:'Gioco spento',avviato:'In corso',cambiato:'Rivelato',terminato:'Sessione terminata'}[f]||f; }

  function render(st){
    cur=st;
    $('phaseBig').textContent=faseLbl(st.fase);
    var meta='Sessione '+(st.sessione||'—');
    if(st.fase==='avviato') meta+=' · si vede la Foto A';
    else if(st.fase==='cambiato') meta+=' · si vede la rivelazione';
    else if(st.fase==='terminato') meta+=' · chiusa';
    $('phaseMeta').textContent=meta;
    $('cntA').textContent=st.aperture_a||0;
    $('cntB').textContent=st.aperture_b||0;

    // comandi secondo la fase
    $('bAvvia').disabled  = !(st.fase==='spento' || st.fase==='terminato');
    $('bCambia').disabled = (st.fase!=='avviato');
    $('bFinisci').disabled= !(st.fase==='avviato' || st.fase==='cambiato');

    // preparazione: IA per utenti foto, upload per gli altri
    var foto = st.flags && st.flags.foto;
    $('secPrep').classList.toggle('hidden', !foto);
    $('secCarica').classList.toggle('hidden', !!foto);
  }

  function poll(){ statoGet().then(function(j){ if(j&&j.stato){ render(j.stato); } }).catch(function(){}); }

  function dopoComando(res, ok){
    if(res.code===401){ mostraErr('Il link non è più valido (sessione finita o revocato). Chiedi un nuovo link.'); return; }
    if(res.data && res.data.ok){ toast(ok,'ok'); if(res.data.stato) render(res.data.stato); else poll(); }
    else { toast((res.data&&res.data.errore)||'Operazione non riuscita','err'); }
  }

  $('bAvvia').addEventListener('click', function(){ cmd('avvia').then(function(r){ dopoComando(r,'Avviato ✓'); }); });
  $('bCambia').addEventListener('click', function(){ cmd('cambia').then(function(r){ dopoComando(r,'Rivelato ✓'); }); });
  $('bFinisci').addEventListener('click', function(){
    if(!confirm('Finire la sessione? Il gioco si chiude e questo link smette di funzionare.')) return;
    cmd('finisci').then(function(r){ dopoComando(r,'Sessione chiusa ✓'); });
  });

  // vai a capo
  $('bNL').addEventListener('click', function(){
    var t=$('txt'); var s=t.selectionStart, e=t.selectionEnd, v=t.value;
    if(typeof s==='number'){ t.value=v.slice(0,s)+'\n'+v.slice(e); var p=s+1; t.focus(); try{t.setSelectionRange(p,p);}catch(_){ } }
    else { t.value=v+'\n'; t.focus(); }
  });

  // genera con IA
  $('bGen').addEventListener('click', function(){
    var t=(($('txt').value)||'').trim();
    if(!t){ toast('Scrivi cosa deve comparire sul foglio','err'); return; }
    var b=$('bGen'); b.disabled=true; var old=b.textContent; b.textContent='Genero con IA… (~30s)';
    generaIA(t).then(function(r){
      b.disabled=false; b.textContent=old;
      if(r.code===401){ mostraErr('Il link non è più valido. Chiedi un nuovo link.'); return; }
      if(r.data && r.data.ok){ toast('Rivelazione creata ✓','ok'); var gp=$('genPrev'); if(gp && r.data.preview){ gp.src=r.data.preview; gp.style.display='block'; } poll(); }
      else { toast((r.data&&r.data.errore)||'Generazione fallita','err'); }
    }).catch(function(){ b.disabled=false; b.textContent=old; toast('Server non raggiungibile','err'); });
  });

  // caricamento foto (base e B)
  function wireSlot(slotId, slotName, prevId){
    var lab=$(slotId); if(!lab) return;
    var inp=lab.querySelector('input[type=file]');
    inp.addEventListener('change', function(){
      var f=inp.files && inp.files[0]; if(!f) return;
      lab.querySelector('.tag').textContent='Carico…';
      carica(slotName, f).then(function(r){
        if(r.code===401){ mostraErr('Il link non è più valido. Chiedi un nuovo link.'); return; }
        if(r.data && r.data.ok){
          lab.querySelector('.tag').textContent='Caricata ✓';
          if(prevId && r.data.preview){ var p=$(prevId); p.src=r.data.preview; p.style.display='block'; }
          poll();
        } else { lab.querySelector('.tag').textContent='Carica'; toast((r.data&&r.data.errore)||'Caricamento fallito','err'); }
      }).catch(function(){ lab.querySelector('.tag').textContent='Carica'; toast('Server non raggiungibile','err'); });
      inp.value='';
    });
  }
  wireSlot('slotBase','BASE','basePrev');
  wireSlot('slotB','B','bPrev');

  // avvio
  $('main').classList.remove('hidden');
  poll();
  setInterval(poll, 4000);
})();
</script>
</body>
</html>
