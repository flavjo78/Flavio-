<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pillolario</title>
<style>
@font-face{font-family:"Figtree";src:url(fonts/figtree.woff2) format("woff2");font-weight:300 900;font-display:swap}
@font-face{font-family:"Bricolage Grotesque";src:url(fonts/bricolage.woff2) format("woff2");font-weight:200 800;font-display:swap}
html{-webkit-text-size-adjust:100%} [hidden]{display:none!important}

/* Layout: una colonna da telefono; in alto il "blister" del giorno (una bolla per dose), sotto la lista a orari, barra fissa in basso. */
:root{
  --bg:#FAFCFB; --surface:#FFFFFF; --surface2:#EEF6F3; --ink:#27403A; --muted:#71857F; --line:#E3ECE9;
  --accent:#17A589; --on-accent:#FFFFFF; --accent-soft:#DDF4EE;
  --warn:#C27A0A; --warn-soft:#FFF6DF; --late:#C8503E; --late-soft:#FCE9E5;
  --m1:#2F9E86; --m2:#E0892B; --m3:#5B74D6; --m4:#C9527A; --m5:#8A6BC9;
  --lock:#F4FAF8; --lock-ink:#27403A;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:20px;
}
/* tema unico chiaro, per scelta */

*{box-sizing:border-box}
body{margin:0;-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:460px;margin:0 auto;padding-block:calc(18px + env(safe-area-inset-top,0px)) 130px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}
.preview{align-self:flex-start;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);border:1px dashed var(--line);border-radius:99px;padding:4px 12px}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05;margin:0;text-wrap:balance}
.date{color:var(--muted);font-size:14px;font-weight:500;margin-bottom:2px}
.bell{flex:none;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);
  border-radius:99px;padding:9px 14px;font-weight:600;font-size:14px}
.bell i{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}

/* settimana */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;border-radius:14px;color:var(--muted)}
.day b{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.day span{font-family:var(--display);font-weight:700;font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}
.day.today span{color:var(--accent)}
.day[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.day[aria-pressed="true"] span{color:var(--bg)}

/* blister */
.blister{background:var(--surface2);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.blister-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.count{font-family:var(--display);font-weight:700;font-size:22px}
.count small{font-family:var(--body);font-weight:500;font-size:14px;color:var(--muted)}
.next{font-size:13px;font-weight:600;color:var(--muted);text-align:right}
.cells{display:flex;flex-wrap:wrap;gap:10px}
.cell{width:38px;height:38px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 34% 28%,var(--surface) 0 12%,transparent 46%),var(--c);
  box-shadow:inset 0 -4px 7px rgba(0,0,0,.14),0 2px 4px rgba(0,0,0,.10);transition:transform .25s}
.cell.out{background:var(--bg);box-shadow:inset 0 2px 4px rgba(0,0,0,.14);transform:scale(.92)}
.cell.out::after{content:"";position:absolute;left:13px;top:10px;width:8px;height:14px;
  border:solid var(--muted);border-width:0 2.5px 2.5px 0;transform:rotate(42deg)}
.empty{color:var(--muted);font-size:15px;margin:0}

/* dosi */
.list{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.dose{display:grid;grid-template-columns:52px 40px minmax(0,1fr) auto;align-items:center;gap:12px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 12px 14px}
.dose.now{border-color:var(--warn);background:var(--warn-soft)}
.dose.done{opacity:.62}
.time{font-family:var(--display);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
.name{font-weight:700;overflow-wrap:anywhere}
.done .name{text-decoration:line-through}
.sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.chip{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:99px;padding:2px 8px}
.chip.now{background:var(--warn);color:var(--bg)}
.chip.late{background:var(--late-soft);color:var(--late)}
.take{min-width:76px;min-height:44px;border-radius:99px;font-weight:700;font-size:14px;padding:0 14px;
  background:var(--accent);color:var(--on-accent)}
.acts-d{display:flex;flex-direction:column;align-items:stretch;gap:2px}
.skip{min-height:32px;font-size:13px;font-weight:600;color:var(--muted);border-radius:99px}
.chip.skip-c{background:var(--surface2);color:var(--muted)}
.snz-b{font-size:12px;font-weight:700;color:var(--accent);border:1px solid var(--accent-soft);background:var(--accent-soft);border-radius:99px;padding:3px 10px}
.chip.snz-c{background:var(--accent-soft);color:var(--accent)}
.snz-acts{display:flex;flex-direction:column;gap:10px}
.dose.ign .name{text-decoration:line-through}
.dose.ign{opacity:.62}
.cell.ign{background:var(--bg);box-shadow:inset 0 2px 4px rgba(0,0,0,.14);transform:scale(.92)}
.cell.ign::before,.cell.ign::after{content:"";position:absolute;left:18px;top:10px;width:2.5px;height:18px;background:var(--muted);border-radius:2px;transform:rotate(45deg)}
.cell.ign::after{transform:rotate(-45deg)}
.take.undo{background:transparent;color:var(--muted);border:1px solid var(--line)}
.take:disabled{background:transparent;color:var(--muted);border:1px dashed var(--line);cursor:default}

/* forme */
.shape{width:40px;height:40px;display:grid;place-items:center}
.shape i{display:block;background:var(--c)}
.shape.compressa i{width:28px;height:28px;border-radius:50%;background:linear-gradient(90deg,transparent 46%,var(--surface) 46% 54%,transparent 54%),var(--c)}
.shape.capsula i{width:34px;height:16px;border-radius:99px;transform:rotate(-35deg);background:linear-gradient(90deg,var(--c) 50%,var(--surface2) 50%);box-shadow:0 0 0 1.5px var(--c)}
.shape.gocce i{width:22px;height:22px;border-radius:0 60% 60% 60%;transform:rotate(45deg) translate(3px,3px)}
.shape.integratore i{width:26px;height:26px;border-radius:9px;transform:rotate(12deg)}

/* farmaci */
.med{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.med .edit{font-size:13px;font-weight:600;color:var(--accent)}
.grp{border:1px solid var(--line);border-radius:24px;background:var(--surface2);padding:8px;display:flex;flex-direction:column;gap:8px}
.grp-h{display:flex;align-items:center;gap:10px;padding:4px 6px 4px 4px}
.grp-t{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;min-height:44px}
.grp-t .arr{flex:none;width:28px;height:28px;border-radius:50%;background:var(--surface);display:grid;place-items:center;transition:transform .2s;font-size:13px;color:var(--muted)}
.grp-t[aria-expanded="true"] .arr{transform:rotate(90deg)}
.grp-t b{display:block;font-family:var(--display);font-size:18px;overflow-wrap:anywhere}
.grp-t small{display:block;font-size:13px;color:var(--muted);font-weight:600}
.grp.paused{background:var(--bg);border-style:dashed}
.grp.paused .grp-t b{color:var(--muted)}
.grp.paused .med{opacity:.55}
.grp-b{display:flex;flex-direction:column;gap:8px}
.grp-edit{align-self:flex-start;font-size:13px;font-weight:700;color:var(--accent);min-height:36px;padding:0 8px}
.switch{flex:none;position:relative;width:52px;height:30px}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .2s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(22px)}
.switch input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.loose{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 4px 0}
.newgrp{align-self:flex-start}
.paused-note{font-size:13px;color:var(--muted);font-weight:600;margin:0}
.dots{display:flex;gap:4px;margin-top:6px}
.dots s{text-decoration:none;font-size:11px;font-weight:700;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;
  background:var(--surface2);color:var(--muted)}
.dots s.on{background:var(--accent-soft);color:var(--accent)}
h2{font-family:var(--display);font-size:20px;margin:6px 0 0}
.hint{color:var(--muted);font-size:14px;margin:0}

/* barra */
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:428px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.tab{min-height:46px;border-radius:14px;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--ink);background:var(--surface2)}
.add{width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:32px;line-height:1;
  margin-top:-26px;box-shadow:0 6px 16px rgba(23,165,137,.3);border:4px solid var(--bg)}

/* foglio */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(4,12,10,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:460px;max-height:92%;overflow:auto;border-radius:26px 26px 0 0;
  padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sheet,.notif{animation:none}.cell{transition:none}}
.sheet h2{margin:0;font-size:24px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lab{font-size:13px;font-weight:600;color:var(--muted)}
.field input[type=text],.field input[type=time]{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;min-width:0}
.two{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:10px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-weight:600;font-size:14px;min-height:40px}
.opt[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.opt.d{width:40px;padding:0;border-radius:50%}
.sw{width:40px;height:40px;border-radius:50%;background:var(--c);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
.trow{display:flex;gap:8px;align-items:center}
.trow .tbtn{flex:1;width:auto;height:auto;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);
  display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:16px}
.tbtn strong{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.tbtn span{font-size:13px;font-weight:600;color:var(--accent)}
/* scelta orario */
#tpScrim,#grpScrim{z-index:22}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:99px;padding:4px;gap:4px}
.seg button{min-height:40px;border-radius:99px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(39,64,58,.15)}
.tp-now{text-align:center;font-family:var(--display);font-weight:700;font-size:44px;font-variant-numeric:tabular-nums;line-height:1}
.wheels{position:relative;display:flex;justify-content:center;gap:6px;height:200px;background:var(--surface2);border-radius:18px;overflow:hidden}
.wheels::before{content:"";position:absolute;left:12px;right:12px;top:80px;height:40px;border-radius:12px;background:var(--surface);box-shadow:0 1px 4px rgba(39,64,58,.12)}
.wheels::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(var(--surface2),transparent 35%,transparent 65%,var(--surface2))}
.wheel{position:relative;width:84px;height:200px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;padding:80px 0;overscroll-behavior:contain}
.wheel::-webkit-scrollbar{display:none}
.wheel div{height:40px;display:grid;place-items:center;scroll-snap-align:center;font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.wheel div.on{color:var(--ink)}
.colon{position:relative;align-self:center;font-family:var(--display);font-size:26px;font-weight:700;z-index:1}
.moments{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mo{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;border-radius:16px;border:1px solid var(--line);text-align:left}
.mo small{font-size:13px;color:var(--muted);font-weight:600}
.mo strong{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.mo[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.mo[aria-pressed="true"] small{color:var(--on-accent);opacity:.85}
.fine{display:flex;gap:8px}
.fine button{flex:1;min-height:46px;border-radius:99px;border:1px solid var(--line);font-weight:700}
.trow button{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);color:var(--muted);font-size:20px}
.link{align-self:flex-start;color:var(--accent);font-weight:700;font-size:14px;min-height:40px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:600}
.toggle small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.toggle input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.err{color:var(--late);font-size:14px;font-weight:600;margin:0}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1;min-height:50px;border-radius:99px;font-weight:700;background:var(--accent);color:var(--on-accent);padding:0 18px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.del{flex:none;background:transparent;color:var(--late);border:1px solid var(--late-soft)}

.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:25;
  background:var(--ink);color:var(--bg);border-radius:99px;padding:10px 18px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
.warn{background:var(--warn-soft);border:1px solid var(--warn);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;font-size:14px;font-weight:600}
.warn button{flex:none;background:var(--warn);color:var(--bg);border-radius:99px;padding:8px 14px;font-weight:700}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div><div class="date" id="dateLabel"></div><h1 id="title">Oggi</h1></div>
    <button class="bell" id="bell" type="button"><i></i>Prova avviso</button>
  </header>

  <div class="warn" id="warn" hidden><span id="warnTxt"></span><button type="button" id="warnBtn">Attiva</button></div>

  <section id="viewToday" style="display:flex;flex-direction:column;gap:16px">
    <div class="week" id="week"></div>
    <div class="blister">
      <div class="blister-head"><div class="count" id="count"></div><div class="next" id="next"></div></div>
      <div class="cells" id="cells" aria-hidden="true"></div>
    </div>
    <p class="paused-note" id="pausedNote" hidden></p>
    <ul class="list" id="doses"></ul>
  </section>

  <section id="viewMeds" hidden>
    <div style="display:flex;flex-direction:column;gap:10px">
      <p class="hint">Tocca una scheda per cambiare orari e giorni. Con l'interruttore metti in pausa una cura intera.</p>
      <div class="list" id="meds"></div>
      <button class="link newgrp" id="newGrp" type="button">+ Nuovo gruppo</button>
    </div>
  </section>
</div>

<nav class="bar"><div class="bar-in" role="tablist">
  <button class="tab" id="tabToday" role="tab" aria-selected="true" type="button">Oggi</button>
  <button class="add" id="add" type="button" aria-label="Aggiungi promemoria">+</button>
  <button class="tab" id="tabMeds" role="tab" aria-selected="false" type="button">Le mie pillole</button>
</div></nav>

<div class="scrim" id="scrim" hidden>
  <form class="sheet" id="form" novalidate>
    <h2 id="sheetTitle">Nuovo promemoria</h2>
    <div class="two">
      <div class="field"><label for="fName">Nome</label><input id="fName" type="text" placeholder="es. Vitamina D" autocomplete="off"></div>
      <div class="field"><label for="fDose">Dose</label><input id="fDose" type="text" placeholder="1 compressa" autocomplete="off"></div>
    </div>
    <div class="field"><span class="lab">Gruppo (cura)</span><div class="opts" id="fGroup"></div></div>
    <div class="field"><span class="lab">Forma</span><div class="opts" id="fForm"></div></div>
    <div class="field"><span class="lab">Colore</span><div class="opts" id="fColor"></div></div>
    <div class="field"><span class="lab">Orari</span><div id="fTimes" style="display:flex;flex-direction:column;gap:8px"></div>
      <button class="link" id="addTime" type="button">+ Aggiungi un orario</button></div>
    <div class="field"><span class="lab">Giorni</span><div class="opts" id="fDays"></div>
      <button class="link" id="allDays" type="button">Tutti i giorni</button></div>
    <label class="toggle" for="fInsist"><span>Insisti finché non confermo<small>Richiami sempre più forti a 10, 20 e 30 minuti, poi allarme ogni 10 minuti finché non rispondi</small></span><input id="fInsist" type="checkbox" checked></label>
    <p class="err" id="err" hidden></p>
    <div class="acts">
      <button class="btn del" id="del" type="button" hidden>Elimina</button>
      <button class="btn ghost" id="cancel" type="button">Annulla</button>
      <button class="btn" type="submit">Salva</button>
    </div>
  </form>
</div>

<div class="scrim" id="tpScrim" hidden>
  <div class="sheet" role="dialog" aria-labelledby="tpTitle">
    <h2 id="tpTitle">Orario</h2>
    <div class="seg" role="group" aria-label="Modo di scelta">
      <button type="button" id="tpModeW" aria-pressed="true">Rotelle</button>
      <button type="button" id="tpModeM" aria-pressed="false">Momenti</button>
    </div>
    <div class="tp-now" id="tpNow">08:00</div>
    <div class="wheels" id="tpW"><div class="wheel" id="tpH" aria-label="Ore"></div><span class="colon">:</span><div class="wheel" id="tpM" aria-label="Minuti"></div></div>
    <div id="tpMo" hidden style="display:flex;flex-direction:column;gap:10px">
      <div class="moments" id="tpMoments"></div>
      <div class="fine"><button type="button" id="tpMinus">− 15 min</button><button type="button" id="tpPlus">+ 15 min</button></div>
    </div>
    <div class="acts"><button class="btn ghost" type="button" id="tpNo">Annulla</button><button class="btn" type="button" id="tpOk">Conferma</button></div>
  </div>
</div>
<div class="scrim" id="grpScrim" hidden>
  <form class="sheet" id="grpForm" novalidate>
    <h2 id="grpTitle">Nuovo gruppo</h2>
    <div class="field"><label for="grpName">Nome del gruppo</label><input id="grpName" type="text" placeholder="es. Cura antibiotico, Integratori inverno" autocomplete="off"></div>
    <p class="err" id="grpErr" hidden></p>
    <div class="acts">
      <button class="btn del" id="grpDel" type="button" hidden>Elimina</button>
      <button class="btn ghost" id="grpNo" type="button">Annulla</button>
      <button class="btn" type="submit">Salva</button>
    </div>
  </form>
</div>
<div class="scrim" id="snzScrim" hidden>
  <div class="sheet" role="dialog" aria-labelledby="snzTitle">
    <h2 id="snzTitle">Posticipa</h2>
    <p class="hint" id="snzSub"></p>
    <div class="snz-acts">
      <button class="btn" type="button" id="snz30">Tra 30 minuti</button>
      <button class="btn" type="button" id="snz60">Tra 1 ora</button>
      <button class="btn ghost" type="button" id="snzNo">Annulla</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script src="capacitor.js"></script>
<script>
const $=id=>document.getElementById(id);
const DAYS=['L','M','M','G','V','S','D'], DAYN=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
const FORMS=[['compressa','Compressa'],['capsula','Capsula'],['gocce','Gocce'],['integratore','Integratore']];
const COLORS=['--m1','--m2','--m3','--m4','--m5'];
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dIdx=d=>(d.getDay()+6)%7;
const mins=t=>+t.slice(0,2)*60+ +t.slice(3);
let today=new Date(); today.setHours(0,0,0,0);
let sel=new Date(today), editing=null, draft=null, uid=1;

const STORE='pillolario.v1';
let meds=[], groups=[], snoozes=[]; const taken=new Set(), ignored=new Set();
const handled=k=>taken.has(k)||ignored.has(k);
const snoozeOf=k=>snoozes.find(x=>x.date+'|'+x.medId+'|'+x.time===k&&x.at>Date.now());
const hm=ms=>{ const d=new Date(ms); return pad(d.getHours())+':'+pad(d.getMinutes()); };
try{ const s=JSON.parse(localStorage.getItem(STORE)||'{}'); meds=s.meds||[]; groups=s.groups||[]; snoozes=s.snoozes||[];
  const lim=new Date(today); lim.setDate(lim.getDate()-90); const lk=key(lim);
  (s.taken||[]).forEach(k=>{ if(k.slice(0,10)>=lk) taken.add(k); });
  (s.ignored||[]).forEach(k=>{ if(k.slice(0,10)>=lk) ignored.add(k); }); }catch(e){}
uid=meds.reduce((a,m)=>Math.max(a,m.id),0)+1;
let gid=groups.reduce((a,g)=>Math.max(a,g.id),0)+1;
const groupOf=m=>m.group?groups.find(g=>g.id===m.group):null;
/* una pillola e' attiva se non sta in un gruppo in pausa */
const active=m=>{ const g=groupOf(m); return !g||!g.paused; };
function save(){ try{ localStorage.setItem(STORE,JSON.stringify({meds,groups,snoozes,taken:[...taken],ignored:[...ignored]})); }catch(e){} }
let syncT; function sync(){ save(); clearTimeout(syncT); syncT=setTimeout(()=>{ schedule(); tidy(); },400); }
function mark(k,how){ taken.delete(k); ignored.delete(k); snoozes=snoozes.filter(x=>x.date+'|'+x.medId+'|'+x.time!==k); if(how==='take') taken.add(k); if(how==='skip') ignored.add(k); }

function dosesFor(date){ const di=dIdx(date), k=key(date), out=[];
  const hist=date<today;
  meds.forEach(m=>{ if(m.days.includes(di)&&(hist||active(m))) m.times.forEach(t=>out.push({m,time:t,k:k+'|'+m.id+'|'+t})); });
  return out.sort((a,b)=>mins(a.time)-mins(b.time)||a.m.id-b.m.id); }
function el(tag,cls,txt){ const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
function shape(m){ const s=el('span','shape '+m.form); s.style.setProperty('--c','var('+m.color+')'); s.appendChild(el('i')); return s; }

function renderWeek(){ const w=$('week'); w.textContent=''; const mon=new Date(today); mon.setDate(mon.getDate()-dIdx(today));
  for(let i=0;i<7;i++){ const d=new Date(mon); d.setDate(mon.getDate()+i);
    const b=el('button','day'+(+d===+today?' today':'')); b.type='button'; b.setAttribute('aria-pressed',+d===+sel);
    b.setAttribute('aria-label',DAYN[i]+' '+d.getDate()); b.append(el('b','',DAYS[i]),el('span','',d.getDate()));
    b.onclick=()=>{sel=d;render();}; w.appendChild(b); } }

function renderToday(){ const list=dosesFor(sel), isToday=+sel===+today, future=sel>today, past=sel<today;
  const now=new Date(), nm=now.getHours()*60+now.getMinutes();
  $('title').textContent=isToday?'Oggi':sel.toLocaleDateString('it-IT',{weekday:'long'}).replace(/^./,c=>c.toUpperCase());
  $('dateLabel').textContent=sel.toLocaleDateString('it-IT',{day:'numeric',month:'long',year:'numeric'});
  const done=list.filter(d=>taken.has(d.k)).length;
  $('count').innerHTML=''; $('count').append(done+' di '+list.length+' ', el('small','',list.length===1?'presa':'prese'));
  const nx=isToday&&list.find(d=>!handled(d.k));
  $('next').textContent=!list.length?'':list.every(d=>handled(d.k))?'Giornata completa':nx?'Prossima alle '+nx.time:'';
  const cells=$('cells'); cells.textContent='';
  list.forEach(d=>{ const c=el('span','cell'+(taken.has(d.k)?' out':ignored.has(d.k)?' ign':'')); c.style.setProperty('--c','var('+d.m.color+')'); cells.appendChild(c); });
  const pg=groups.filter(g=>g.paused); $('pausedNote').hidden=!pg.length||sel<today;
  $('pausedNote').textContent=(pg.length===1?'In pausa: ':'In pausa ('+pg.length+'): ')+pg.map(g=>g.name).join(', ');
  const ul=$('doses'); ul.textContent='';
  if(!list.length){ ul.appendChild(el('p','empty',meds.length?'Nessuna pillola in programma per questo giorno.':'Tocca + qui sotto per aggiungere la prima pillola o integratore.')); return; }
  list.forEach(d=>{ const t=taken.has(d.k), ig=ignored.has(d.k), h=t||ig, dm=mins(d.time);
    const sz=!h&&snoozeOf(d.k), isNow=isToday&&!h&&!sz&&Math.abs(dm-nm)<=30, late=!h&&!sz&&(past||(isToday&&dm<nm-30));
    const li=el('li','dose'+(t?' done':'')+(ig?' ign':'')+(isNow?' now':''));
    const mid=el('div'); mid.style.minWidth='0'; mid.appendChild(el('div','name',d.m.name));
    const sub=el('div','sub'); sub.appendChild(el('span','',d.m.dose));
    if(ig) sub.appendChild(el('span','chip skip-c','Ignorata'));
    else if(sz) sub.appendChild(el('span','chip snz-c','Posticipata · '+hm(sz.at)));
    else if(isNow) sub.appendChild(el('span','chip now','Adesso'));
    else if(late) sub.appendChild(el('span','chip late',past?'Saltata':'In ritardo'));
    if(isToday&&!h&&dm<=nm+30){ const p=el('button','snz-b',sz?'Cambia':'Posticipa'); p.type='button';
      p.setAttribute('aria-label','Posticipa '+d.m.name+' delle '+d.time); p.onclick=()=>openSnooze(d.m,d.time,key(today)); sub.appendChild(p); }
    mid.appendChild(sub);
    const box=el('div','acts-d');
    const b=el('button','take'+(h?' undo':''),h?'Annulla':future?'In arrivo':'Presa'); b.type='button'; b.disabled=future;
    b.setAttribute('aria-label',(h?'Annulla ':'Segna come presa: ')+d.m.name+' delle '+d.time);
    b.onclick=()=>{ mark(d.k,h?'':'take'); sync(); render(); if(!h) toast(d.m.name+' segnata come presa'); };
    box.appendChild(b);
    if(!h&&!future){ const g=el('button','skip','Ignora'); g.type='button'; g.setAttribute('aria-label','Ignora '+d.m.name+' delle '+d.time);
      g.onclick=()=>{ mark(d.k,'skip'); sync(); render(); toast(d.m.name+' ignorata'); }; box.appendChild(g); }
    li.append(el('span','time',d.time),shape(d.m),mid,box); ul.appendChild(li); }); }

function medCard(m){ const b=el('button','med'); b.type='button';
  const mid=el('div'); mid.style.minWidth='0'; mid.append(el('div','name',m.name),el('div','sub',m.dose+' · '+m.times.join(' · ')));
  const dots=el('div','dots'); DAYS.forEach((l,i)=>dots.appendChild(el('s',m.days.includes(i)?'on':'',l))); mid.appendChild(dots);
  b.append(shape(m),mid,el('span','edit','Modifica')); b.onclick=()=>openSheet(m); return b; }
function renderMeds(){ const box=$('meds'); box.textContent='';
  if(!meds.length&&!groups.length) box.appendChild(el('p','empty','Ancora niente. Tocca + per aggiungere la prima pillola.'));
  groups.forEach(g=>{ const list=meds.filter(m=>m.group===g.id), open=!!g.open;
    const sec=el('section','grp'+(g.paused?' paused':'')), h=el('div','grp-h');
    const t=el('button','grp-t'); t.type='button'; t.setAttribute('aria-expanded',open);
    const txt=el('span'); txt.style.minWidth='0';
    txt.append(el('b','',g.name),el('small','',(list.length===1?'1 pillola':list.length+' pillole')+(g.paused?' · In pausa':' · Attivo')));
    t.append(el('span','arr','▶'),txt); t.onclick=()=>{ g.open=!g.open; save(); renderMeds(); };
    const sw=el('label','switch'), inp=el('input'); inp.type='checkbox'; inp.id='grpSw'+g.id; inp.checked=!g.paused; inp.setAttribute('role','switch');
    inp.setAttribute('aria-label',(g.paused?'Riattiva ':'Metti in pausa ')+g.name);
    inp.onchange=()=>{ g.paused=!inp.checked; g.open=!g.paused; sync(); render(); toast(g.paused?g.name+' in pausa: nessun avviso':g.name+' di nuovo attivo'); };
    sw.append(inp,el('span')); h.append(t,sw); sec.appendChild(h);
    if(open){ const body=el('div','grp-b');
      if(!list.length) body.appendChild(el('p','hint','Nessuna pillola. Aprine una e scegli questo gruppo.'));
      list.forEach(m=>body.appendChild(medCard(m)));
      const e=el('button','grp-edit','Rinomina o elimina gruppo'); e.type='button'; e.onclick=()=>openGroup(g); body.appendChild(e);
      sec.appendChild(body); }
    box.appendChild(sec); });
  const loose=meds.filter(m=>!groupOf(m));
  if(loose.length&&groups.length) box.appendChild(el('p','loose','Senza gruppo'));
  loose.forEach(m=>box.appendChild(medCard(m))); }
function render(){ renderWeek(); renderToday(); renderMeds(); if(!$('viewMeds').hidden) tab('meds'); }

function tab(t){ const td=t==='today'; $('viewToday').hidden=!td; $('viewToday').style.display=td?'flex':'none'; $('viewMeds').hidden=td;
  $('tabToday').setAttribute('aria-selected',td); $('tabMeds').setAttribute('aria-selected',!td);
  if(!td){ $('title').textContent='Le mie pillole'; const na=meds.filter(active).length; $('dateLabel').textContent=na+(na===1?' promemoria attivo':' promemoria attivi')+(na<meds.length?' · '+(meds.length-na)+' in pausa':''); } else renderToday(); }
$('tabToday').onclick=()=>tab('today'); $('tabMeds').onclick=()=>tab('meds');

/* foglio */
function openSheet(m){ editing=m||null;
  draft=m?{group:m.group||0,form:m.form,color:m.color,times:[...m.times],days:[...m.days]}:{group:0,form:'compressa',color:COLORS[meds.length%5],times:['08:00'],days:[0,1,2,3,4,5,6]};
  $('sheetTitle').textContent=m?'Modifica promemoria':'Nuovo promemoria';
  $('fName').value=m?m.name:''; $('fDose').value=m?m.dose:''; $('fInsist').checked=m?m.insist:true;
  $('del').hidden=!m; $('err').hidden=true; drawSheet(); $('scrim').hidden=false; if(!m) $('fName').focus(); }
function drawSheet(){ const gb=$('fGroup'); gb.textContent='';
  [[0,'Nessuno'],...groups.map(g=>[g.id,g.name+(g.paused?' (in pausa)':'')])].forEach(([v,l])=>{ const b=el('button','opt',l); b.type='button';
    b.setAttribute('aria-pressed',draft.group===v); b.onclick=()=>{ draft.group=v; drawSheet(); }; gb.appendChild(b); });
  const nb=el('button','opt','+ Nuovo'); nb.type='button'; nb.onclick=()=>openGroup(null,true); gb.appendChild(nb);
  const f=$('fForm'); f.textContent='';
  FORMS.forEach(([v,l])=>{ const b=el('button','opt',l); b.type='button'; b.setAttribute('aria-pressed',draft.form===v); b.onclick=()=>{draft.form=v;drawSheet();}; f.appendChild(b); });
  const c=$('fColor'); c.textContent='';
  COLORS.forEach((v,i)=>{ const b=el('button','sw'); b.type='button'; b.style.setProperty('--c','var('+v+')'); b.setAttribute('aria-label','Colore '+(i+1));
    b.setAttribute('aria-pressed',draft.color===v); b.onclick=()=>{draft.color=v;drawSheet();}; c.appendChild(b); });
  const t=$('fTimes'); t.textContent='';
  draft.times.forEach((v,i)=>{ const r=el('div','trow'), b=el('button','tbtn'); b.type='button'; b.id='fTime'+i;
    b.setAttribute('aria-label','Orario '+(i+1)+': '+v+', tocca per cambiare'); b.append(el('strong','',v),el('span','','Cambia'));
    b.onclick=()=>openTP(i); r.appendChild(b);
    if(draft.times.length>1){ const x=el('button','', '×'); x.type='button'; x.setAttribute('aria-label','Togli orario '+v); x.onclick=()=>{draft.times.splice(i,1);drawSheet();}; r.appendChild(x); }
    t.appendChild(r); });
  const d=$('fDays'); d.textContent='';
  DAYS.forEach((l,i)=>{ const b=el('button','opt d',l); b.type='button'; b.setAttribute('aria-label',DAYN[i]); b.setAttribute('aria-pressed',draft.days.includes(i));
    b.onclick=()=>{ draft.days=draft.days.includes(i)?draft.days.filter(x=>x!==i):[...draft.days,i]; drawSheet(); }; d.appendChild(b); }); }
$('addTime').onclick=()=>{ const last=mins(draft.times[draft.times.length-1]||'08:00'), n=(last+240)%1440; draft.times.push(pad(n/60|0)+':'+pad(n%60)); drawSheet(); openTP(draft.times.length-1); };
$('allDays').onclick=()=>{ draft.days=[0,1,2,3,4,5,6]; drawSheet(); };
const closeSheet=()=>{ $('scrim').hidden=true; };
$('cancel').onclick=closeSheet; $('scrim').onclick=e=>{ if(e.target===$('scrim')) closeSheet(); };
$('add').onclick=()=>openSheet();
$('form').onsubmit=e=>{ e.preventDefault(); const name=$('fName').value.trim(), times=[...new Set(draft.times.filter(Boolean))].sort();
  const msg=!name?'Scrivi il nome della pillola.':!times.length?'Imposta almeno un orario.':!draft.days.length?'Scegli almeno un giorno.':'';
  if(msg){ $('err').textContent=msg; $('err').hidden=false; return; }
  const data={group:draft.group||0,name,dose:$('fDose').value.trim()||'1 dose',form:draft.form,color:draft.color,times,days:[...draft.days].sort(),insist:$('fInsist').checked};
  if(editing) Object.assign(editing,data); else meds.push({id:uid++,...data});
  closeSheet(); sync(); askPerm(); render(); if(!$('viewMeds').hidden) tab('meds'); toast(editing?'Promemoria aggiornato':'Promemoria salvato'); };
$('del').onclick=()=>{ meds=meds.filter(m=>m!==editing); closeSheet(); sync(); render(); if(!$('viewMeds').hidden) tab('meds'); toast('Promemoria eliminato'); };

/* notifiche (solo nell'app installata) */
const CAP=window.Capacitor, NATIVE=!!(CAP&&CAP.isNativePlatform&&CAP.isNativePlatform());
const LN=NATIVE?CAP.registerPlugin('LocalNotifications'):null, APP=NATIVE?CAP.registerPlugin('App'):null;
const CHS=[
  {id:'p1',name:'Primo avviso',description:'Avviso all\'orario della pillola',importance:5,visibility:1,vibration:true,pattern:[0,400,200,400]},
  {id:'p2',name:'Secondo avviso',description:'Se non hai ancora confermato: vibrazione più lunga',importance:5,visibility:1,vibration:true,pattern:[0,800,300,800,300,800]},
  {id:'p3',name:'Avvisi successivi',description:'Ancora non confermato: vibrazione lunga e suono della sveglia',importance:5,visibility:1,vibration:true,pattern:[0,1200,400,1200,400,1200,400,1200],systemSound:'alarm'},
  {id:'p4',name:'Allarme continuo',description:'Dopo 30 minuti senza risposta: ogni 10 minuti al volume della sveglia, finché non premi Presa, Ignora o Posticipa',importance:5,visibility:1,vibration:true,pattern:[0,1500,500,1500,500,1500,500,1500],systemSound:'alarmMax'}];
const OLD_CH=['promemoria','pillole'], TEST_ID=900000, SLOT0=100000;
/* ogni dose (pillola + orario) ha uno slot fisso: i richiami sostituiscono l'avviso, cosi' sull'icona c'e' 1 per dose */
const slotOf=(m,t)=>SLOT0+(m.id%500)*1440+mins(t);
const TITLES=['È ora di ','Promemoria: ','Non dimenticare: ','Ancora da prendere: '];
const MIN=60000, LOOP_MAX=12*60*MIN; /* l'allarme continuo si ferma comunque dopo 12 ore */
/* level 1 = primo avviso, 2 = più forte, 3 = forte con suono della sveglia */
function note(id,m,t,date,schedule,level,loopUntil){ level=level||1; return {id,channelId:'p'+level,actionTypeId:'DOSE',schedule,
  autoCancel:false, title:TITLES[level-1]+m.name, body:m.dose+' · ore '+t, extra:{medId:m.id,time:t,date:date||'',slot:slotOf(m,t),loop:!!loopUntil,loopUntil:loopUntil||0}}; }
/* allarme continuo: primo squillo a 'start', poi il telefono lo ripete da solo ogni 10 minuti */
function loopNote(id,m,t,date,start,until,now){ if(start<=now+5000) start=now+10*MIN-((now-start)%(10*MIN)); if(start<=now+5000) start+=10*MIN;
  return start<until?note(id,m,t,date,{at:new Date(start),allowWhileIdle:true},4,until):null; }
async function schedule(){ if(!LN) return;
  try{ const p=await LN.getPending(), ids=new Set(p.notifications.filter(n=>n.id<TEST_ID).map(n=>n.id));
    let prev=0; try{ prev=+localStorage.getItem('pillolario.nids')||0; }catch(e){}
    for(let i=1;i<=prev;i++) ids.add(i); /* anche gli allarmi continui gia' partiti */
    if(ids.size) await LN.cancel({notifications:[...ids].map(id=>({id}))});
    const list=[], now=Date.now(); let id=1;
    meds.filter(active).forEach(m=>m.times.forEach(t=>{ const h=+t.slice(0,2), mi=+t.slice(3);
      m.days.forEach(di=>list.push(note(id++,m,t,'',{on:{weekday:(di+1)%7+1,hour:h,minute:mi,second:0},allowWhileIdle:true})));
      if(m.insist) for(let g=0;g<7;g++){ const d=new Date(today); d.setDate(d.getDate()+g);
        const k=key(d)+'|'+m.id+'|'+t; if(!m.days.includes(dIdx(d))||handled(k)||snoozeOf(k)) continue;
        [[10,2],[20,3],[30,3]].forEach(([x,lv])=>{ const at=new Date(d); at.setHours(h,mi+x,0,0);
          if(+at>now+5000&&list.length<450) list.push(note(id++,m,t,key(d),{at,allowWhileIdle:true},lv)); });
        const base=new Date(d); base.setHours(h,mi,0,0); const ln=loopNote(id,m,t,key(d),+base+40*MIN,+base+LOOP_MAX,now);
        if(ln&&list.length<450){ list.push(ln); id++; } } }));
    snoozes=snoozes.filter(s=>s.at>now-LOOP_MAX&&!handled(s.date+'|'+s.medId+'|'+s.time));
    snoozes.forEach(s=>{ const m=meds.find(x=>x.id===s.medId); if(!m||!active(m)) return;
      [[0,2],[10,3],[20,3]].forEach(([x,lv])=>{ if(x&&!m.insist) return; const at=s.at+x*MIN;
        if(at>now+5000) list.push(note(id++,m,s.time,s.date,{at:new Date(at),allowWhileIdle:true},lv)); });
      if(m.insist){ const ln=loopNote(id,m,s.time,s.date,s.at+30*MIN,s.at+LOOP_MAX,now); if(ln){ list.push(ln); id++; } } });
    try{ localStorage.setItem('pillolario.nids',String(id-1)); }catch(e){}
    save(); if(list.length) await LN.schedule({notifications:list});
  }catch(e){ console.error(e); } }
/* toglie dalle notifiche (e quindi dal numero sull'icona) le dosi gia' prese o ignorate */
async function tidy(){ if(!LN) return;
  try{ const r=await LN.getDeliveredNotifications(), now=new Date(), nm=now.getHours()*60+now.getMinutes(), out=[];
    r.notifications.forEach(n=>{ if(n.id<SLOT0||n.id>=TEST_ID) return;
      const mid=Math.floor((n.id-SLOT0)/1440), mm=(n.id-SLOT0)%1440, t=pad(mm/60|0)+':'+pad(mm%60);
      const m=meds.find(q=>q.id%500===mid&&q.times.includes(t)&&active(q));
      const d=new Date(now); if(mm>nm) d.setDate(d.getDate()-1);
      const k=key(d)+'|'+m.id+'|'+t; if(!m||handled(k)||snoozeOf(k)) out.push({id:n.id,title:'',body:''}); });
    if(out.length) await LN.removeDeliveredNotifications({notifications:out}); }catch(e){ console.error(e); } }
function doseDate(x){ if(x.date) return x.date; const d=new Date(); if(d.getHours()*60+d.getMinutes()<mins(x.time)-5) d.setDate(d.getDate()-1); return key(d); }
async function checkPerm(){ if(!LN) return true;
  try{ const p=await LN.checkPermissions(); let ok=p.display==='granted', txt='Le notifiche sono spente: senza, gli avvisi non arrivano.';
    if(ok){ try{ const e=await LN.checkExactNotificationSetting(); if(e.exact_alarm!=='granted'){ ok=false; txt='Consenti "Sveglie e promemoria" per avvisi puntuali.'; $('warn').dataset.k='exact'; } }catch(e){} }
    else $('warn').dataset.k='notif';
    $('warnTxt').textContent=txt; $('warn').hidden=ok||!meds.length; return ok; }catch(e){ return false; } }
async function askPerm(){ if(!LN) return true;
  try{ const p=await LN.checkPermissions(); if(p.display!=='granted') await LN.requestPermissions(); }catch(e){}
  return checkPerm(); }
$('warnBtn').onclick=async()=>{ try{ if($('warn').dataset.k==='exact') await LN.changeExactNotificationSetting(); else await LN.requestPermissions(); }catch(e){} if(await checkPerm()) schedule(); };
/* scelta orario: rotelle oppure momenti della giornata */
const MOMENTI=[['Risveglio',420],['Colazione',480],['Pranzo',780],['Pomeriggio',1020],['Cena',1200],['Prima di dormire',1350]];
let tp={i:0,v:480,mode:'w'}; try{ tp.mode=localStorage.getItem('pillolario.tpmode')||'w'; }catch(e){}
const fmt=v=>pad(v/60|0)+':'+pad(v%60);
(function buildWheels(){ for(let h=0;h<24;h++) $('tpH').appendChild(el('div','',pad(h))); for(let m=0;m<60;m+=5) $('tpM').appendChild(el('div','',pad(m))); })();
function wheelRead(){ const h=Math.max(0,Math.min(23,Math.round($('tpH').scrollTop/40))), m=Math.max(0,Math.min(11,Math.round($('tpM').scrollTop/40)));
  [...$('tpH').children].forEach((d,i)=>d.classList.toggle('on',i===h)); [...$('tpM').children].forEach((d,i)=>d.classList.toggle('on',i===m));
  return h*60+m*5; }
function wheelSet(v){ v=Math.round(v/5)*5%1440; $('tpH').scrollTop=(v/60|0)*40; $('tpM').scrollTop=(v%60)/5*40; wheelRead(); }
['tpH','tpM'].forEach(id=>$(id).addEventListener('scroll',()=>{ if(tp.mode!=='w') return; tp.v=wheelRead(); $('tpNow').textContent=fmt(tp.v); }));
function drawMoments(){ const box=$('tpMoments'); box.textContent='';
  MOMENTI.forEach(([n,v])=>{ const b=el('button','mo'); b.type='button'; b.setAttribute('aria-pressed',v===tp.v); b.append(el('small','',n),el('strong','',fmt(v)));
    b.onclick=()=>{ tp.v=v; drawTP(); }; box.appendChild(b); }); }
function drawTP(){ const w=tp.mode==='w'; $('tpModeW').setAttribute('aria-pressed',w); $('tpModeM').setAttribute('aria-pressed',!w);
  $('tpW').hidden=!w; $('tpMo').hidden=w; $('tpMo').style.display=w?'none':'flex'; $('tpNow').textContent=fmt(tp.v);
  if(w) requestAnimationFrame(()=>wheelSet(tp.v)); else drawMoments(); }
function setMode(m){ tp.mode=m; try{ localStorage.setItem('pillolario.tpmode',m); }catch(e){} drawTP(); }
function openTP(i){ tp.i=i; tp.v=mins(draft.times[i]); $('tpTitle').textContent=draft.times.length>1?'Orario '+(i+1):'Orario'; $('tpScrim').hidden=false; drawTP(); }
$('tpModeW').onclick=()=>setMode('w'); $('tpModeM').onclick=()=>setMode('m');
$('tpMinus').onclick=()=>{ tp.v=(tp.v+1425)%1440; drawTP(); }; $('tpPlus').onclick=()=>{ tp.v=(tp.v+15)%1440; drawTP(); };
$('tpOk').onclick=()=>{ draft.times[tp.i]=fmt(tp.v); $('tpScrim').hidden=true; drawSheet(); };
$('tpNo').onclick=()=>{ $('tpScrim').hidden=true; }; $('tpScrim').onclick=e=>{ if(e.target===$('tpScrim')) $('tpScrim').hidden=true; };

/* gruppi (cure) */
let grpEditing=null, grpFromSheet=false;
function openGroup(g,fromSheet){ grpEditing=g||null; grpFromSheet=!!fromSheet; $('grpTitle').textContent=g?'Modifica gruppo':'Nuovo gruppo';
  $('grpName').value=g?g.name:''; $('grpDel').hidden=!g; $('grpErr').hidden=true; $('grpScrim').hidden=false; $('grpName').focus(); }
const closeGroup=()=>{ $('grpScrim').hidden=true; };
$('grpNo').onclick=closeGroup; $('grpScrim').onclick=e=>{ if(e.target===$('grpScrim')) closeGroup(); };
$('newGrp').onclick=()=>openGroup(null);
$('grpForm').onsubmit=e=>{ e.preventDefault(); const name=$('grpName').value.trim();
  if(!name){ $('grpErr').textContent='Scrivi il nome del gruppo.'; $('grpErr').hidden=false; return; }
  if(grpEditing) grpEditing.name=name; else { const g={id:gid++,name,paused:false,open:true}; groups.push(g); if(grpFromSheet&&draft) draft.group=g.id; }
  closeGroup(); sync(); render(); if(!$('viewMeds').hidden) tab('meds'); if(grpFromSheet&&!$('scrim').hidden) drawSheet(); toast(grpEditing?'Gruppo rinominato':'Gruppo creato'); };
$('grpDel').onclick=()=>{ const g=grpEditing; if(!g) return; meds.forEach(m=>{ if(m.group===g.id) m.group=0; }); groups=groups.filter(x=>x!==g);
  closeGroup(); sync(); render(); if(!$('viewMeds').hidden) tab('meds'); toast('Gruppo eliminato: le pillole restano, senza gruppo'); };

/* posticipa */
let snzDose=null;
function openSnooze(m,t,date){ snzDose={m,t,date}; $('snzTitle').textContent='Posticipa '+m.name; $('snzSub').textContent=m.dose+' · previsto alle '+t; $('snzScrim').hidden=false; }
function doSnooze(min){ if(!snzDose) return; const {m,t,date}=snzDose, k=date+'|'+m.id+'|'+t, at=Date.now()+min*60000;
  mark(k,''); snoozes.push({medId:m.id,time:t,date,at}); $('snzScrim').hidden=true; sync(); render(); toast('Te lo ricordo alle '+hm(at)); }
$('snz30').onclick=()=>doSnooze(30); $('snz60').onclick=()=>doSnooze(60);
$('snzNo').onclick=()=>{ $('snzScrim').hidden=true; }; $('snzScrim').onclick=e=>{ if(e.target===$('snzScrim')) $('snzScrim').hidden=true; };
$('bell').onclick=async()=>{ if(!LN){ toast("Gli avvisi funzionano nell'app installata sul telefono"); return; }
  if(!await askPerm()){ $('warn').hidden=false; toast('Prima attiva le notifiche'); return; }
  try{ await LN.schedule({notifications:[{id:TEST_ID,channelId:'p1',title:'Avviso di prova',body:'Se lo vedi a schermo spento, Pillolario funziona.',schedule:{at:new Date(Date.now()+15000),allowWhileIdle:true}}]});
    toast('Spegni lo schermo: tra 15 secondi arriva un avviso'); }catch(e){ toast('Non riesco a programmare l\'avviso'); } };
function refresh(){ const n=new Date(); n.setHours(0,0,0,0); if(+n!==+today){ today=n; sel=new Date(n); } render(); if($('viewToday').hidden) tab('meds'); schedule(); tidy(); checkPerm(); }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refresh(); });
setInterval(()=>{ if(!document.hidden&&!$('viewToday').hidden&&$('scrim').hidden) renderToday(); },60000);
(async function init(){ if(!LN) return;
  try{ for(const c of OLD_CH){ try{ await LN.deleteChannel({id:c}); }catch(e){} }
    for(const c of CHS) await LN.createChannel({...c,lights:true,lightColor:'#17A589'});
    await LN.registerActionTypes({types:[{id:'DOSE',actions:[{id:'take',title:'Presa'},{id:'skip',title:'Ignora'},{id:'snooze',title:'Posticipa'}]}]});
    await LN.addListener('localNotificationActionPerformed',ev=>{ const x=ev.notification&&ev.notification.extra; if(!x||!x.medId) return;
      const m=meds.find(q=>q.id===x.medId); if(!m) return; const date=doseDate(x);
      const k=date+'|'+m.id+'|'+x.time;
      if(ev.actionId==='take'){ mark(k,'take'); toast(m.name+' segnata come presa'); }
      else if(ev.actionId==='skip'){ mark(k,'skip'); toast(m.name+' ignorata'); }
      else if(ev.actionId==='snooze'){ sel=new Date(today); render(); tab('today'); openSnooze(m,x.time,date); return; }
      sync(); sel=new Date(today); render(); tab('today'); });
    await APP.addListener('backButton',()=>{ if(!$('grpScrim').hidden) closeGroup(); else if(!$('tpScrim').hidden) $('tpScrim').hidden=true; else if(!$('snzScrim').hidden) $('snzScrim').hidden=true; else if(!$('scrim').hidden) closeSheet(); else if(!$('viewMeds').hidden) tab('today'); else APP.minimizeApp(); });
  }catch(e){ console.error(e); }
  if(meds.length) await askPerm(); schedule(); tidy(); })();
let tt; function toast(m){ const t=$('toast'); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,2400); }
render();
</script>
